<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="bb-shell" [class.no-nav]="!auth.isLogged()">

  <!-- ── Sidebar Nav ───────────────────────── -->
  <nav class="bb-sidebar" *ngIf="auth.isLogged()">
    <div class="bb-logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">Beauty<strong>Brain</strong></span>
    </div>

    <ul class="bb-nav">
      <li class="nav-section">Menu</li>

      <li>
        <a routerLink="/catalogo" routerLinkActive="active" pRipple>
          <i class="pi pi-sparkles"></i> Catálogo
        </a>
      </li>
      <li>
        <a routerLink="/sobre" routerLinkActive="active" pRipple>
          <i class="pi pi-info-circle"></i> Sobre
        </a>
      </li>

      <ng-container *ngIf="!auth.isAdmin()">
        <li class="nav-section">Agendamento</li>
        <li>
          <a routerLink="/agendamentos/novo" routerLinkActive="active" pRipple>
            <i class="pi pi-plus-circle"></i> Solicitar
          </a>
        </li>
        <li>
          <a routerLink="/agenda/minha" routerLinkActive="active" pRipple>
            <i class="pi pi-calendar"></i> Minha Agenda
          </a>
        </li>
      </ng-container>

      <ng-container *ngIf="auth.isAdmin()">
        <li class="nav-section">Administração</li>
        <li>
          <a routerLink="/agendamentos/aprovacoes" routerLinkActive="active" pRipple>
            <i class="pi pi-check-circle"></i> Aprovações
          </a>
        </li>
        <li>
          <a routerLink="/agenda/admin" routerLinkActive="active" pRipple>
            <i class="pi pi-calendar-plus"></i> Agenda Geral
          </a>
        </li>
      </ng-container>
    </ul>

    <div class="bb-user-panel">
      <p-avatar [label]="initials()" styleClass="bb-avatar"></p-avatar>
      <div class="user-info">
        <span class="user-name">{{ auth.userName() }}</span>
        <span class="user-role">{{ auth.isAdmin() ? 'Administrador' : 'Cliente' }}</span>
      </div>
      <button class="logout-btn" (click)="auth.logout()" title="Sair">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </nav>

  <!-- ── Main Content ──────────────────────── -->
  <main class="bb-main">
    <router-outlet></router-outlet>
  </main>

</div>
